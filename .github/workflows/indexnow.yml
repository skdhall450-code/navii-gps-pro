name: Submit URLs to IndexNow

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - SEO and Build Quality
    types:
      - completed

permissions:
  contents: read

# Only the newest main-branch deployment should submit the production sitemap.
# A newer push cancels any older run that is waiting for an obsolete Vercel commit.
concurrency:
  group: indexnow-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Wait for Vercel production deployment and submit sitemap URLs
        env:
          EXPECTED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          node scripts/submit-indexnow.mjs --wait-for-deployment
