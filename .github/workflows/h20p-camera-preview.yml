name: H20P camera preview
on:
  pull_request:
    paths:
      - 'components/dashboard/VehicleCameraPanel.tsx'
      - 'app/dashboard/vehicles/**'
      - 'test/browser/h20p-camera-panel.mjs'
      - '.github/workflows/h20p-camera-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_H20P_PREVIEW: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node test/browser/h20p-camera-panel.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h20p-camera-preview
          path: test-results/h20p
