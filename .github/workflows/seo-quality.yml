name: SEO and Build Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: seo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate SEO source data
        run: npm run seo:check:source

      - name: Run lint checks
        run: npm run lint

      - name: Check panel and public-page regressions
        run: node --experimental-strip-types --test test/*.test.mjs test/*.test.cjs

      - name: Verify customer app QR payload
        run: |
          python3 -m pip install --target /tmp/navii-qr-check Pillow==11.3.0 zxing-cpp==2.3.0
          PYTHONPATH=/tmp/navii-qr-check python3 test/verify-app-qr.py

      - name: Build production website
        id: build
        run: npm run build

      - name: Install Chromium for GPS display checks
        run: npx playwright install --with-deps chromium

      - name: Check GPS screens in a real browser using isolated fixtures
        run: node test/browser/gps-freshness.mjs

      - name: Check live refresh cancellation, timeout and history updates
        run: node test/browser/live-refresh.mjs

      - name: Check vehicle detail refresh with isolated slow and revoked-access responses
        run: node test/browser/vehicle-detail-refresh.mjs

      - name: Upload GPS browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gps-browser-${{ github.sha }}
          path: test-results/gps-browser
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify rendered SEO pages
        run: npm run seo:check

      - name: Upload SEO audit and keyword inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-${{ github.sha }}
          path: |
            .next/seo-audit.json
            .next/seo-audit.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Check premium product collection in Chromium
        run: node test/browser/product-showcase.mjs

      - name: Upload product browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-browser-${{ github.sha }}
          path: test-results/product-browser

      - name: Check premium Home in Chromium
        run: node test/browser/home-premium.mjs

      - name: Upload Home browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-browser-${{ github.sha }}
          path: test-results/home-browser
          if-no-files-found: ignore
          retention-days: 7

      - name: Check Shop Now pricing in Chromium
        run: node test/browser/shop-pricing.mjs

      - name: Upload shop browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shop-browser-${{ github.sha }}
          path: test-results/shop-browser
          if-no-files-found: ignore
          retention-days: 7

      - name: Check customer portal and login in Chromium
        run: node test/browser/customer-portal.mjs

      - name: Upload customer portal browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-portal-${{ github.sha }}
          path: test-results/customer-portal
          if-no-files-found: ignore
          retention-days: 7

      - name: Check customer alert settings in Chromium
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node test/browser/customer-settings.mjs

      - name: Upload customer settings browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-settings-${{ github.sha }}
          path: test-results/customer-settings
          if-no-files-found: ignore
          retention-days: 7
