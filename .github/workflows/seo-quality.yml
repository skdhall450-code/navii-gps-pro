name: SEO and Build Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: seo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate SEO source data
        run: npm run seo:check:source

      - name: Run lint checks
        run: npm run lint

      - name: Check panel and public-page regressions
        run: node --experimental-strip-types --test test/*.test.mjs test/*.test.cjs

      - name: Build production website
        run: npm run build

      - name: Install Chromium for GPS display checks
        run: npx playwright install --with-deps chromium

      - name: Check GPS screens in a real browser using isolated fixtures
        run: node test/browser/gps-freshness.mjs

      - name: Upload GPS browser checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gps-browser-${{ github.sha }}
          path: test-results/gps-browser
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify rendered SEO pages
        run: npm run seo:check

      - name: Upload SEO audit and keyword inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-${{ github.sha }}
          path: |
            .next/seo-audit.json
            .next/seo-audit.md
          if-no-files-found: ignore
          retention-days: 30
